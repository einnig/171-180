<!DOCTYPE html>
<html lang="is">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markorð: 171 - 180 algengustu í íslenskum námsbókum</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #f0f4f8; 
            margin: 0;
            padding: 2vh 5vw; 
            min-height: 95vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .container { 
            width: 100%; 
            max-width: 1200px; 
            background: white; 
            padding: 30px 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            max-height: 100%;
            overflow-y: auto;
        }
        h1 {
            color: #1a73e8;
            font-size: 2em;
            margin-top: 0;
            margin-bottom: 15px;
        }
        /* Framvindustika */
        .progress-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
            height: 20px;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: #34a853;
            border-radius: 10px;
            transition: width 0.5s ease-in-out;
        }
        
        #counter { font-size: 1.2em; color: #666; font-weight: bold; margin-bottom: 10px; }

        .lang-selector {
            margin-bottom: 20px;
            background: #fff3e0;
            padding: 10px 15px;
            border-radius: 10px;
            display: inline-block;
            border: 1px solid #ffcc80;
        }

        .lang-selector select {
            padding: 8px;
            font-size: 1.1em;
            border-radius: 5px;
            border: 1px solid #ccc;
            cursor: pointer;
            margin-left: 10px;
            max-width: 300px;
        }
        
        #target { 
            font-size: 4em; 
            margin: 10px 0; 
            color: #222; 
            font-weight: bold;
        }
        
        #is-explanation {
            font-size: 1.2em;
            color: #333;
            background-color: #e8f0fe;
            padding: 15px 25px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 20px;
            max-width: 80%;
            line-height: 1.6;
            text-align: left;
        }

        .btn { 
            padding: 12px 25px; 
            font-size: 1.2em; 
            margin: 5px; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            background-color: #1a73e8; 
            color: white; 
            transition: 0.3s; 
            font-weight: bold;
        }
        .btn:hover:not(:disabled) { background-color: #1557b0; transform: scale(1.02); }
        .recording { background-color: #d93025; animation: pulse 1.5s infinite; }
        .recording:hover { background-color: #b3140b; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #media-box { 
            font-size: 1.1em; 
            color: #444; 
            text-align: left; 
            background: #f8fbff; 
            padding: 15px 30px; 
            border-radius: 12px; 
            line-height: 1.6; 
            border-left: 6px solid #1a73e8; 
            margin-top: 15px;
            display: inline-block;
            min-width: 70%;
        }
        #spoken {
            margin-top: 15px; 
            font-size: 1.4em;
            font-style: italic; 
            color: #555;
        }
        #result {
            font-weight: bold; 
            font-size: 1.8em; 
            margin-top: 5px; 
            color: #1a73e8;
        }
        .nav-btns { margin-top: 20px; }
        
        /* Fyrir nafnainnslátt */
        #studentName {
            font-size: 1.5em;
            padding: 10px;
            margin: 20px 0;
            width: 80%;
            max-width: 400px;
            border: 2px solid #1a73e8;
            border-radius: 8px;
            text-align: center;
        }

        .feedback-note {
            margin-top: 40px;
            font-size: 0.95em;
            color: #555;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }
        .feedback-note a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: bold;
        }
        .feedback-note a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

        <button class="btn" style="background-color: #5f6368;" onclick="nextExercise()">Næsta ➡️</button>

    <div class="feedback-note">
        Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
    </div>
</div>

<script>
const exerciseData = [
    { 
        text: "ár", 
        is_exp: "<b>Útskýring:</b> (Nafnorð) Tímabil sem er 365 dagar (eða 12 mánuðir). Getur líka þýtt rennandi vatn, en er oftast notað sem tímabil.<br><br><b>Dæmi 1:</b> Við óskum ykkur gleðilegs <b>árs</b>!<br><b>Dæmi 2:</b> Ég bjó þar í eitt <b>ár</b>.",
        translations: {
            "ar": "<div dir='rtl'><b>الشرح:</b> (اسم) فترة زمنية تتكون من 365 يوماً (سنة).<br><b>مثال 1:</b> نتمنى لكم <b>سنة</b> سعيدة!<br><b>مثال 2:</b> عشت هناك لمدة <b>سنة</b> واحدة.</div>",
            "da": "<b>Forklaring:</b> (Navneord) En periode på 365 dage (år).<br><b>Eksempel 1:</b> Vi ønsker jer et godt <b>år</b>!<br><b>Eksempel 2:</b> Jeg boede der i et <b>år</b>.",
            "en": "<b>Explanation:</b> (Noun) A period of 365 days (year).<br><b>Example 1:</b> We wish you a happy new <b>year</b>!<br><b>Example 2:</b> I lived there for one <b>year</b>.",
            "tl": "<b>Paliwanag:</b> (Pangngalan) Panahon ng 365 araw (taon).<br><b>Halimbawa 1:</b> Nais namin sa inyo ang isang masayang bagong <b>taon</b>!<br><b>Halimbawa 2:</b> Tumira ako roon ng isang <b>taon</b>.",
            "pl": "<b>Wyjaśnienie:</b> (Rzeczownik) Okres 365 dni (rok).<br><b>Przykład 1:</b> Życzymy szczęśliwego nowego <b>roku</b>!<br><b>Przykład 2:</b> Mieszkałem tam przez jeden <b>rok</b>.",
            "es": "<b>Explicación:</b> (Sustantivo) Un período de 365 días (año).<br><b>Ejemplo 1:</b> ¡Les deseamos un feliz <b>año</b>!<br><b>Ejemplo 2:</b> Viví allí por un <b>año</b>.",
            "uk": "<b>Пояснення:</b> (Іменник) Період у 365 днів (рік).<br><b>Приклад 1:</b> Бажаємо щасливого нового <b>року</b>!<br><b>Приклад 2:</b> Я жив там один <b>рік</b>.",
            "vi": "<b>Giải thích:</b> (Danh từ) Một khoảng thời gian 365 ngày (năm).<br><b>Ví dụ 1:</b> Chúc bạn một <b>năm</b> mới hạnh phúc!<br><b>Ví dụ 2:</b> Tôi đã sống ở đó một <b>năm</b>."
        }
    },
    { 
        text: "fleiri", 
        is_exp: "<b>Útskýring:</b> (Lýsingarorð / Óákveðið fornafn) Miðstig af 'margir'. Þýðir að fjöldinn er meiri.<br><b>Andheiti:</b> færri.<br><br><b>Dæmi 1:</b> Það voru <b>fleiri</b> þar en ég bjóst við.<br><b>Dæmi 2:</b> Eru <b>fleiri</b> spurningar?",
        translations: {
            "ar": "<div dir='rtl'><b>الشرح:</b> (صفة) صيغة التفضيل من 'كثير' (أكثر/عدد أكبر).<br><b>مثال 1:</b> كان هناك أشخاص <b>أكثر</b> مما توقعت.<br><b>مثال 2:</b> هل هناك <b>المزيد</b> من الأسئلة؟</div>",
            "da": "<b>Forklaring:</b> (Tillægsord) Komparativ af 'mange' (flere).<br><b>Eksempel 1:</b> Der var <b>flere</b> der, end jeg forventede.<br><b>Eksempel 2:</b> Er der <b>flere</b> spørgsmål?",
            "en": "<b>Explanation:</b> (Adjective / Pronoun) Comparative of 'many' (more). Means a larger number.<br><b>Example 1:</b> There were <b>more</b> people there than I expected.<br><b>Example 2:</b> Are there <b>any more</b> questions?",
            "tl": "<b>Paliwanag:</b> Comparative ng 'marami' (mas marami).<br><b>Halimbawa 1:</b> Mayroong <b>mas maraming</b> tao roon kaysa sa inaasahan ko.<br><b>Halimbawa 2:</b> Mayroon pa bang <b>iba pang</b> katanungan?",
            "pl": "<b>Wyjaśnienie:</b> (Przymiotnik) Stopień wyższy od 'wielu' (więcej/więksi).<br><b>Przykład 1:</b> Było tam <b>więcej</b> osób, niż się spodziewałem.<br><b>Przykład 2:</b> Czy są <b>jeszcze jakieś (więcej)</b> pytania?",
            "es": "<b>Explicación:</b> (Adjetivo / Pronombre) Comparativo de 'muchos' (más).<br><b>Ejemplo 1:</b> Había <b>más</b> personas de las que esperaba.<br><b>Ejemplo 2:</b> ¿Hay <b>más</b> preguntas?",
            "uk": "<b>Пояснення:</b> (Прикметник) Вищий ступінь від 'багато' (більше).<br><b>Приклад 1:</b> Там було <b>більше</b> людей, ніж я очікував.<br><b>Приклад 2:</b> Є <b>ще (більше)</b> запитання?",
            "vi": "<b>Giải thích:</b> So sánh hơn của 'nhiều' (nhiều hơn - dùng cho đếm được).<br><b>Ví dụ 1:</b> Có <b>nhiều</b> người ở đó hơn tôi mong đợi.<br><b>Ví dụ 2:</b> Còn <b>thêm</b> câu hỏi nào không?"
        }
    },
    { 
        text: "áhrif", 
        is_exp: "<b>Útskýring:</b> (Nafnorð) Þegar eitthvað breytir eða verkar á eitthvað annað. Að 'hafa áhrif á eitthvað' (hvorugkyn fleirtala).<br><br><b>Dæmi 1:</b> Veðrið hefur mikil <b>áhrif</b> á skapið mitt.<br><b>Dæmi 2:</b> Lyfið hafði engin <b>áhrif</b> á sjúkdóminn.",
        translations: {
            "ar": "<div dir='rtl'><b>الشرح:</b> (اسم) عندما يغير شيء ما شيئاً آخر (تأثير).<br><b>مثال 1:</b> الطقس له <b>تأثير</b> كبير على مزاجي.<br><b>مثال 2:</b> لم يكن للدواء أي <b>تأثير</b> على المرض.</div>",
            "da": "<b>Forklaring:</b> (Navneord) Når noget ændrer eller virker på noget andet (effekt/indflydelse).<br><b>Eksempel 1:</b> Vejret har stor <b>indflydelse</b> på mit humør.<br><b>Eksempel 2:</b> Medicinen havde ingen <b>effekt</b>.",
            "en": "<b>Explanation:</b> (Noun) When something changes or acts upon something else (effect/influence/impact).<br><b>Example 1:</b> The weather has a big <b>effect</b> on my mood.<br><b>Example 2:</b> The medicine had no <b>effect</b> on the disease.",
            "tl": "<b>Paliwanag:</b> (Pangngalan) Epekto o impluwensya.<br><b>Halimbawa 1:</b> Malaki ang <b>epekto</b> ng panahon sa aking mood.<br><b>Halimbawa 2:</b> Walang <b>epekto</b> ang gamot sa sakit.",
            "pl": "<b>Wyjaśnienie:</b> (Rzeczownik) Kiedy coś zmienia lub działa na coś innego (wpływ/efekt).<br><b>Przykład 1:</b> Pogoda ma duży <b>wpływ</b> na mój nastrój.<br><b>Przykład 2:</b> Lekarstwo nie miało żadnego <b>efektu</b>.",
            "es": "<b>Explicación:</b> (Sustantivo) Cuando algo cambia o actúa sobre otra cosa (efecto/influencia).<br><b>Ejemplo 1:</b> El clima tiene un gran <b>efecto</b> en mi estado de ánimo.<br><b>Ejemplo 2:</b> La medicina no tuvo <b>efecto</b> sobre la enfermedad.",
            "uk": "<b>Пояснення:</b> (Іменник) Коли щось змінює або діє на інше (вплив/ефект).<br><b>Приклад 1:</b> Погода має великий <b>вплив</b> на мій настрій.<br><b>Приклад 2:</b> Ліки не мали жодного <b>ефекту</b>.",
            "vi": "<b>Giải thích:</b> (Danh từ) Khi một cái gì đó thay đổi hoặc tác động lên cái gì khác (ảnh hưởng/tác dụng).<br><b>Ví dụ 1:</b> Thời tiết có <b>ảnh hưởng</b> lớn đến tâm trạng của tôi.<br><b>Ví dụ 2:</b> Thuốc không có <b>tác dụng</b> đối với bệnh."
        }
    },
    { 
        text: "orð", 
        is_exp: "<b>Útskýring:</b> (Nafnorð) Grunneining í máli sem hefur merkingu. Sagt eða skrifað (hvorugkyn).<br><br><b>Dæmi 1:</b> Ég skil ekki þetta <b>orð</b>.<br><b>Dæmi 2:</b> Hann stóð við <b>orð</b> sín (stóð við það sem hann sagði).",
        translations: {
            "ar": "<div dir='rtl'><b>الشرح:</b> (اسم) وحدة أساسية في اللغة لها معنى (كلمة).<br><b>مثال 1:</b> أنا لا أفهم هذه <b>الكلمة</b>.<br><b>مثال 2:</b> التزم بـ <b>كلمته</b>.</div>",
            "da": "<b>Forklaring:</b> (Navneord) Grundenhed i sproget (ord).<br><b>Eksempel 1:</b> Jeg forstår ikke dette <b>ord</b>.<br><b>Eksempel 2:</b> Han holdt sit <b>ord</b>.",
            "en": "<b>Explanation:</b> (Noun) A basic unit of language that has meaning (word).<br><b>Example 1:</b> I do not understand this <b>word</b>.<br><b>Example 2:</b> He kept his <b>word</b> (kept his promise).",
            "tl": "<b>Paliwanag:</b> (Pangngalan) Isang pangunahing yunit ng wika na may kahulugan (salita).<br><b>Halimbawa 1:</b> Hindi ko maintindihan ang <b>salita</b>ng ito.<br><b>Halimbawa 2:</b> Tinupad niya ang kanyang <b>salita</b>.",
            "pl": "<b>Wyjaśnienie:</b> (Rzeczownik) Podstawowa jednostka języka mająca znaczenie (słowo).<br><b>Przykład 1:</b> Nie rozumiem tego <b>słowa</b>.<br><b>Przykład 2:</b> Dotrzymał <b>słowa</b>.",
            "es": "<b>Explicación:</b> (Sustantivo) Unidad básica del lenguaje con significado (palabra).<br><b>Ejemplo 1:</b> No entiendo esta <b>palabra</b>.<br><b>Ejemplo 2:</b> Él mantuvo su <b>palabra</b> (cumplió su promesa).",
            "uk": "<b>Пояснення:</b> (Іменник) Основна одиниця мови, що має значення (слово).<br><b>Приклад 1:</b> Я не розумію цього <b>слова</b>.<br><b>Приклад 2:</b> Він дотримав свого <b>слова</b>.",
            "vi": "<b>Giải thích:</b> (Danh từ) Đơn vị cơ bản của ngôn ngữ có ý nghĩa (từ/lời nói).<br><b>Ví dụ 1:</b> Tôi không hiểu <b>từ</b> này.<br><b>Ví dụ 2:</b> Anh ấy đã giữ <b>lời</b>."
        }
    },
    { 
        text: "ein", 
        is_exp: "<b>Útskýring:</b> (Töluorð / Fornafn) Kvenkyn af 'einn' eða fleirtala hvorugkyns. Þýðir eitthvað stakt, eða að vera algjörlega án annarra.<br><br><b>Dæmi 1:</b> Hún var alveg <b>ein</b> heima (engin önnur).<br><b>Dæmi 2:</b> Það er aðeins <b>ein</b> leið fær.",
        translations: {
            "ar": "<div dir='rtl'><b>الشرح:</b> (رقم / ضمير) صيغة المؤنث لـ 'واحد' أو 'وحيدة/وحدها'.<br><b>مثال 1:</b> كانت <b>وحدها</b> تماماً في المنزل.<br><b>مثال 2:</b> هناك طريقة <b>واحدة</b> فقط ممكنة.</div>",
            "da": "<b>Forklaring:</b> (Talord) Hunkøn af 'en', eller at være alene.<br><b>Eksempel 1:</b> Hun var helt <b>alene</b> hjemme.<br><b>Eksempel 2:</b> Der er kun <b>én</b> mulig vej.",
            "en": "<b>Explanation:</b> (Numeral / Pronoun) Feminine form of 'one', or meaning 'alone'.<br><b>Example 1:</b> She was completely <b>alone</b> at home.<br><b>Example 2:</b> There is only <b>one</b> way possible.",
            "tl": "<b>Paliwanag:</b> Pambabaeng anyo ng 'isa', o nangangahulugang 'nag-iisa'.<br><b>Halimbawa 1:</b> Siya ay ganap na <b>nag-iisa</b> sa bahay.<br><b>Halimbawa 2:</b> Mayroon lamang <b>isang</b> paraan na posible.",
            "pl": "<b>Wyjaśnienie:</b> (Liczebnik / Zaimek) Rodzaj żeński od 'jeden' (jedna) lub 'sama'.<br><b>Przykład 1:</b> Była w domu zupełnie <b>sama</b>.<br><b>Przykład 2:</b> Jest tylko <b>jedna</b> możliwa droga.",
            "es": "<b>Explicación:</b> (Numeral) Forma femenina de 'uno' (una), o 'sola'.<br><b>Ejemplo 1:</b> Ella estaba completamente <b>sola</b> en casa.<br><b>Ejemplo 2:</b> Solo hay <b>una</b> forma posible.",
            "uk": "<b>Пояснення:</b> Жіночий рід від 'один' (одна) або 'сама'.<br><b>Приклад 1:</b> Вона була вдома зовсім <b>сама</b>.<br><b>Приклад 2:</b> Є лише <b>один (одна)</b> можливий шлях.",
            "vi": "<b>Giải thích:</b> Dạng giống cái của 'một', hoặc có nghĩa là 'một mình'.<br><b>Ví dụ 1:</b> Cô ấy hoàn toàn <b>một mình</b> ở nhà.<br><b>Ví dụ 2:</b> Chỉ có <b>một</b> con đường khả thi."
        }
    },
    { 
        text: "öll",

let userScores = new Array(exerciseData.length).fill(null);
let userSpoken = new Array(exerciseData.length).fill("");

let currentIndex = 0;
let recognition;
let isRecording = false;
let autoAdvanceTimer = null;
let hasDownloadedCert = false;

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'is-IS';
    recognition.continuous = false;
    recognition.interimResults = false;
    
    recognition.onend = () => {
        isRecording = false;
        const btn = document.getElementById('record-btn');
        if (btn) {
            btn.innerText = "🎤 Tala";
            btn.classList.remove('recording');
        }
        
        const resDiv = document.getElementById('result');
        if (resDiv && resDiv.innerText === "Hlusta...") {
            resDiv.innerText = "";
        }
    };
} else {
    alert("Þessi vafri styður ekki talgreiningu. Notaðu Chrome eða Edge á tölvu.");
}

window.onload = () => { 
    updateUI(); 
};

function updateProgress() {
    let correctCount = 0;
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] === 100) {
            correctCount++;
        }
    }
    const percent = (correctCount / exerciseData.length) * 100;
    
    const progressBar = document.getElementById('progress-bar');
    if(progressBar) {
        progressBar.style.width = percent + '%';
    }
    return correctCount;
}

    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] !== 100) {
            currentIndex = i;
            break;
        }
    }
    
    document.getElementById('app').innerHTML = `

function updateUI() {
    clearTimeout(autoAdvanceTimer); 
    const correctCount = updateProgress();

    if (currentIndex >= exerciseData.length) {
        if (correctCount === exerciseData.length) {
            document.getElementById('app').innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: 100%;"></div></div>
                <h1 style="color: #34a853; font-size: 2.5em;">Frábært! Þú náðir 100% árangri! 🎉</h1>
                <p style="font-size: 1.2em; color: #555;">Skrifaðu nafnið þitt hér að neðan til að sækja viðurkenningarskjalið þitt.</p>
                <input type="text" id="studentName" placeholder="Skrifaðu nafnið þitt hér" autocomplete="off" ${hasDownloadedCert ? 'disabled' : ''}><br>
                <button id="cert-btn" class="btn" style="background-color: ${hasDownloadedCert ? '#5f6368' : '#1a73e8'}; font-size: 1.5em; padding: 15px 30px; margin-top: 10px; cursor: ${hasDownloadedCert ? 'not-allowed' : 'pointer'}; opacity: ${hasDownloadedCert ? '0.7' : '1'};" onclick="downloadCert()" ${hasDownloadedCert ? 'disabled' : ''}>
                    ${hasDownloadedCert ? '✅ Skjal sótt' : '🏆 Sækja viðurkenningarskjal'}
                </button>
                <br><br>
                <button class="btn" style="background-color: #5f6368;" onclick="location.reload()">🔄 Byrja nýja umferð</button>
                <div class="feedback-note">
                    Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
                </div>
            `;
        } else {
            document.getElementById('app').innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: ${(correctCount/exerciseData.length)*100}%;"></div></div>
                <h1 style="color: #fbbc05; font-size: 2em;">Þú ert næstum því búin(n)!</h1>
                <p style="font-size: 1.2em;">Þú hefur klárað ${correctCount} af${exerciseData.length} orðum með 100% árangri.</p>
                <p style="font-size: 1.1em; color: #555;">Farðu til baka og reyndu aftur við þau orð sem vantaði upp á til að fá skjalið.</p>
                <button class="btn" style="background-color: #fbbc05; color: #000;" onclick="findNextUnfinished()">➡️ Fara á orð sem vantar</button>
                <div class="feedback-note">
                    Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
                </div>
            `;
        }
        return;
    }

    const curr = exerciseData[currentIndex];
    
    const langSelect = document.getElementById('languageSelect');
    const selectedLang = langSelect ? langSelect.value : '';

    document.getElementById('target').innerHTML = curr.text;
    document.getElementById('is-explanation').innerHTML = curr.is_exp;
    document.getElementById('counter').innerText = `Orð ${currentIndex + 1} af${exerciseData.length}`;
    
    if (!selectedLang) {
        document.getElementById('media-box').innerHTML = "<i>Veldu tungumál úr listanum að ofan til að sjá þýðingu.</i>";
    } else {
        // Notum ensku sem varalið ef tungumálið vantar
        document.getElementById('media-box').innerHTML = curr.translations[selectedLang] || (curr.translations['en'] + "<br><br><i>(Ath: Þýðingu á þessu tungumáli vantar, sýni ensku)</i>");
    }

    const savedScore = userScores[currentIndex];
    const savedText = userSpoken[currentIndex];

    if (savedScore !== null) {
        document.getElementById('result').innerText = `Einkunn: ${savedScore}%`;
        document.getElementById('spoken').innerText = `Þú sagðir: "${savedText}"`;
    } else {
        document.getElementById('result').innerText = "";
        document.getElementById('spoken').innerText = "";
    }
}

function nextExercise() {
    currentIndex++;
    updateUI();
}

function prevExercise() {
    if (currentIndex > 0) {
        currentIndex--;
        updateUI();
    }
}

function toggleRecord() {
    if (!recognition) return;

    const btn = document.getElementById('record-btn');
    if (isRecording) {
        recognition.stop();
    } else {
        try {
            recognition.start();
            isRecording = true;
            btn.innerText = "🛑 Hlusta...";
            btn.classList.add('recording');
            document.getElementById('result').innerText = "Hlusta...";
            document.getElementById('spoken').innerText = "";
        } catch(e) {
            console.log("Villa í upptöku: " + e);
        }
    }
}

if (recognition) {
    recognition.onresult = (event) => {
        let spoken = event.results[0][0].transcript;
        spoken = spoken.trim().toLowerCase(); 

        document.getElementById('spoken').innerText = `Þú sagðir: "${spoken}"`;
        
        const targetWord = exerciseData[currentIndex].text.toLowerCase();
        
        let score = (spoken === targetWord) ? 100 : 0;
        
        if (spoken.replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"").trim() === targetWord) {
            score = 100;
        }
        
        document.getElementById('result').innerText = `Einkunn: ${score}%`;

        userScores[currentIndex] = score;
        userSpoken[currentIndex] = spoken;
        
        updateProgress();

        if (score === 100) {
            autoAdvanceTimer = setTimeout(() => {
                nextExercise();
            }, 1000); 
        }
    };
}

function downloadCert() {
    if (hasDownloadedCert) return; 

    const studentNameInput = document.getElementById('studentName');
    const studentName = studentNameInput ? studentNameInput.value.trim() : "";
    
    if (studentName === "") {
        alert("Vinsamlegast skrifaðu nafnið þitt fyrst!");
        return;
    }

    const canvas = document.createElement('canvas');
    canvas.width = 900;
    canvas.height = 600;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.strokeStyle = '#1a73e8';
    ctx.lineWidth = 15;
    ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

    ctx.strokeStyle = '#fbbc05';
    ctx.lineWidth = 5;
    ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);
    
    ctx.fillStyle = '#1a73e8';
    ctx.textAlign = 'center';
    ctx.font = 'bold 50px Arial';
    ctx.fillText('Viðurkenning', canvas.width / 2, 140);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('Þetta skjal staðfestir að', canvas.width / 2, 220);
    
    ctx.fillStyle = '#000000';
    ctx.font = 'bold 45px Arial';
    ctx.fillText(studentName, canvas.width / 2, 290);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('hefur lokið æfingunni með glæsibrag:', canvas.width / 2, 360);

    ctx.fillStyle = '#1a73e8';
    ctx.font = 'bold 26px Arial';
    ctx.fillText('Markorð: 171 - 180 algengustu í íslenskum námsbókum', canvas.width / 2, 420);
    
    ctx.fillStyle = '#34a853';
    ctx.font = 'italic 28px Arial';
    ctx.fillText('Frábær árangur! Haltu áfram að æfa þig.', canvas.width / 2, 490);

    const dateString = new Date().toLocaleDateString('is-IS');
    ctx.fillStyle = '#666666';
    ctx.font = '18px Arial';
    ctx.fillText('Dagsetning: ' + dateString, canvas.width / 2, 540);
    
    const link = document.createElement('a');
    link.download = `Vidurkenning_${studentName.replace(/\s+/g, '_')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    
    hasDownloadedCert = true;
    const btn = document.getElementById('cert-btn');
    if (btn) {
        btn.disabled = true;
        btn.innerText = "✅ Skjal sótt";
        btn.style.backgroundColor = "#5f6368";
        btn.style.cursor = "not-allowed";
        btn.style.opacity = "0.7";
    }
    if (studentNameInput) {
        studentNameInput.disabled = true;
    }
}
</script>
